<!DOCTYPE html>
<html>

<head>
  <title>XplatUISocketWasm — window viewer</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: #161b22;
      --panel2: #0b0e13;
      --line: #26303d;
      --fg: #d7e0ea;
      --dim: #7d8b9c;
      --acc: #4cc2ff;
      --ok: #3fd68c;
      --warn: #ffb454;
      --bad: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 12px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 { font-size: 15px; margin: 0; }
    h2 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--dim);
      margin: 0 0 6px;
    }

    .sub { color: var(--dim); font-size: 11px; }
    .dim { color: var(--dim); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; padding: 2px 0; }
    .kv b { font-weight: 600; color: var(--dim); }
    .kv span { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 175px; }

    .tag {
      padding: 1px 8px;
      border-radius: 20px;
      font-size: 11px;
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .tag.on { color: var(--ok); border-color: var(--ok); }
    .tag.off { color: var(--bad); border-color: var(--bad); }
    .tag.wait { color: var(--warn); border-color: var(--warn); }

    .panel {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
    }

    div.win {
      padding: 6px 8px;
      margin: 2px 0;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid transparent;
      font-size: 12px;
    }
    div.win:hover { background: #1c2430; }
    div.win.active { background: #203247; border-color: var(--acc); }
    div.win small { color: var(--dim); display: block; }

    label { display: block; margin: 5px 0; font-size: 12px; }

    input, button, select {
      font: inherit;
      color: var(--fg);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 9px;
    }
    button { cursor: pointer; background: #1c2430; }
    button:hover { border-color: var(--acc); }
    button.primary { background: var(--acc); color: #04121c; border-color: var(--acc); font-weight: 600; }
    button.mini { padding: 2px 7px; font-size: 11px; }

    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: #18181c;
    }
    #frame { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    #svgwrap { width: 100%; height: 100%; }
    #svgwrap svg { width: 100%; height: 100%; }

    #bar {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, .55);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #log {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 170px;
      overflow: auto;
      background: rgba(0, 0, 0, .78);
      border-top: 1px solid var(--line);
      padding: 6px 8px;
      font: 11px/1.45 ui-monospace, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #log .t { color: #5b6b7c; }
    #log .i { color: #9fd0ff; }
    #log .w { color: var(--warn); }
    #log .e { color: var(--bad); }
    #log .s { color: var(--ok); }
  </style>
</head>

<body>
  <div id="sidebar">
    <div>
      <h1>XplatUISocketWasm</h1>
      <div class="sub">AF_UNIX over JS · newline-delimited JSON · base64 frames</div>
      <div class="row" style="margin-top:8px">
        <span id="status" class="tag wait">booting…</span>
        <span class="sub" id="uiroot"></span>
      </div>
    </div>

    <div class="panel">
      <h2>runtime</h2>
      <div class="kv"><b>main assembly</b><span id="info-main">—</span></div>
      <div class="kv"><b>WetJs source</b><span id="info-wet">resolving…</span></div>
      <div class="kv"><b>message pump</b><span id="info-pump">checking…</span></div>
      <div class="kv"><b>frames</b><span id="info-frames">0</span></div>
      <div class="kv"><b>throughput</b><span id="info-fps">0 fps</span></div>
      <div class="row" style="margin-top:6px">
        <button class="mini" id="btn-listeners">listeners</button>
        <button class="mini" id="btn-ping">ping</button>
        <button class="mini" id="btn-die">simulate exit</button>
      </div>
    </div>

    <div class="panel">
      <h2>windows <span class="dim" id="wincount"></span></h2>
      <div id="winlist"><span class="dim">connecting to window-list…</span></div>
    </div>

    <div class="panel">
      <h2>stream</h2>
      <label>format
        <select id="fmt">
          <option>jpeg</option>
          <option>png</option>
          <option>svg</option>
        </select>
      </label>
      <label>quality <input type="range" id="q" min="1" max="100" value="75"></label>
      <label>fps cap <input type="number" id="fps" min="0" max="60" value="0" style="width:70px"> <span class="dim">0 = uncapped</span></label>
      <label><input type="checkbox" id="gray"> grayscale</label>
      <label><input type="checkbox" id="live" checked> live (subscribe)</label>
      <div class="row">
        <button class="primary" id="refresh">refresh</button>
        <button id="save">save frame</button>
      </div>
    </div>

    <div class="panel">
      <h2>connection</h2>
      <div class="kv"><b>window-list</b><span id="info-list">idle</span></div>
      <div class="kv"><b>window</b><span id="info-win">not connected</span></div>
      <div class="row" style="margin-top:6px">
        <button class="mini" id="btn-reconnect">reconnect</button>
        <button class="mini" id="btn-disconnect">disconnect</button>
      </div>
    </div>

    <div class="panel">
      <h2>log</h2>
      <div class="row">
        <button class="mini" id="clearlog">clear</button>
        <button class="mini" id="copylog">copy</button>
        <label style="margin:0"><input type="checkbox" id="autoscroll" checked> autoscroll</label>
      </div>
    </div>
  </div>

  <div id="stage">
    <div id="bar">not connected</div>
    <img id="frame" style="display:none" alt="">
    <div id="svgwrap" style="display:none"></div>
    <div id="log"></div>
  </div>

  <script type="module">
    import { dotnet } from './_framework/dotnet.js'

    // ══════════════════════════════════ 0. tiny helpers ══════════════════════════════════
    const $ = (s) => document.querySelector(s);
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const logBox = $('#log');
    function log(level, msg) {
      const t = new Date().toTimeString().slice(0, 8);
      const cls = level === 'error' ? 'e' : level === 'warn' ? 'w' : level === 'ok' ? 's' : 'i';
      logBox.innerHTML += `<span class="t">${t}</span> <span class="${cls}">${esc(msg)}</span>\n`;
      if (logBox.textContent.length > 250000) logBox.textContent = logBox.textContent.slice(-120000);
      if ($('#autoscroll').checked) logBox.scrollTop = logBox.scrollHeight;
    }
    function setTag(kind, text) {
      const s = $('#status');
      s.className = 'tag ' + kind;
      s.textContent = text;
    }
    function setBar(t) { $('#bar').textContent = t; }
    function info(id, text) { const el = $(id); if (el) el.textContent = text; }

    const UI_ROOT = new URLSearchParams(location.search).get('ui') || '/ui';
    const LIST_PATH = UI_ROOT + '/window-list';
    info('#uiroot', `unix:${UI_ROOT}/*`);
    log('info', `page loaded · viewer for XplatUISocketWasm · socket root ${UI_ROOT}`);

    // ══════════════════════════════════ 1. runtime + .NET → JS wire ══════════════════════════════════
    const conns = new Map();      // handle -> conn
    const services = new Map();   // path -> onAccept (JS-hosted AF_UNIX services)

    const { setModuleImports, getAssemblyExports, getConfig } = await dotnet.create();
    info('#info-main', getConfig().mainAssemblyName);
    log('info', `dotnet runtime created · main assembly "${getConfig().mainAssemblyName}"`);

    setModuleImports('wet', {
      // .NET calls this when a WetSocket connects to a JS-hosted service
      connect(path, handle) {
        const onAccept = services.get(path);
        if (!onAccept) return false;
        log('info', `[js-service] accepted #${handle} on unix:${path}`);
        onAccept(makeConn(handle));
        return true;
      },
      // .NET calls this to signal readable / drained / closed
      notify(handle, kind) {
        const c = conns.get(handle);
        if (!c) return;
        if (kind === 'closed') {
          conns.delete(handle);
          c.closed = true;
          c.onclose?.(c);
          return;
        }
        if (kind === 'drained') { c.onwritable?.(c); return; }
        if (c.onreadable) { c.onreadable(c); return; }
        if (c.ondata) {
          let u8;
          while ((u8 = c.read()).length) c.ondata(u8, c);
        }
      },
    });

    // ══════════════════════════════════ 2. WetJs export resolution ══════════════════════════════════
    // WetJs lives in the WetAfunix class library, not in the main assembly, and the
    // assembly only loads once Main runs → resolve lazily, retry, and report where
    // it came from so the wiring is never a mystery.
    let wet = null;
    let wetSource = null;
    let pump = null;
    let runtimeDead = false;

    function die(reason, level = 'error') {
      if (runtimeDead) return;
      runtimeDead = true;
      log(level, 'runtime stopped: ' + reason);
      setTag('off', 'runtime exited');
      info('#info-pump', 'stopped');
    }

    async function tryResolveWet() {
      const names = [getConfig().mainAssemblyName, 'WetAfunix', 'WetAfunix.dll', 'Wystem.Wet', 'System.Windows.Forms'];
      for (const name of names) {
        let root;
        try { root = await getAssemblyExports(name); }
        catch { continue; }
        const w = root?.WetJs ?? root?.Wystem?.Wet?.WetJs ?? root?.Wystem?.WetJs;
        const p = root?.BootUpJs?.Pump ?? root?.XplatUISocketWasm?.Pump;
        if (!pump && typeof p === 'function') pump = p;
        if (w && typeof w.Write === 'function') {
          if (!wetSource) { wetSource = name; log('ok', `WetJs exports found in assembly "${name}"`); }
          return w;
        }
      }
      return null;
    }

    async function initWet() {
      try {
        const boot = await getAssemblyExports(getConfig().mainAssemblyName);
        boot?.BootUpJs?.LoadWet?.();          // force WetAfunix to load
        if (boot?.BootUpJs?.LoadWet) log('info', 'LoadWet() called — WetAfunix forced to load');
      } catch (e) { log('warn', 'LoadWet not available: ' + (e.message || e)); }

      for (let i = 0; i < 150 && !wet; i++) {
        wet = await tryResolveWet();
        if (!wet) await new Promise((r) => setTimeout(r, 200));
      }
      info('#info-wet', wet ? wetSource : 'NOT FOUND');
      return wet;
    }

    function getWet() {
      if (runtimeDead) throw new Error('.NET runtime already exited');
      if (!wet) throw new Error('WetJs exports not ready yet');
      return wet;
    }

    function toU8(data) {
      return typeof data === 'string' ? enc.encode(data) : (data instanceof Uint8Array ? data : new Uint8Array(data));
    }

    function makeConn(id) {
      const c = {
        id, closed: false, ondata: null, onreadable: null, onwritable: null, onclose: null,
        write(data) { return getWet().Write(id, toU8(data)); },     // partial: bytes accepted
        async writeAll(data) {
          data = toU8(data);
          for (let off = 0; off < data.length;) {
            const n = getWet().Write(id, data.subarray(off));
            if (n < 0) throw new Error(`write: connection #${id} is gone`);
            off += n;
            if (off < data.length) await new Promise((r) => (this.onwritable = r));
          }
          return data.length;
        },
        read(max = 65536) { return getWet().Read(id, max); },
        close() { try { return getWet().Close(id); } catch { return 0; } },
      };
      conns.set(id, c);
      return c;
    }

    const AF_UNIX = {
      list: () => JSON.parse(getWet().List()),
      listeners() {
        return [
          ...JSON.parse(getWet().Listening()).map((r) => ({ ...r, host: 'net' })),
          ...[...services.keys()].map((path) => ({ id: 0, path, host: 'js', state: 'Listening', pending: 0, backlog: 0 })),
        ];
      },
      connect(path) {
        const id = getWet().Connect(path);
        if (id < 0) throw new Error(`connect refused — nothing listening at unix:${path}`);
        return makeConn(id);
      },
      read: (id, max = 65536) => getWet().Read(id, max),
      write: (id, data) => getWet().Write(id, toU8(data)),
      disconnect: (id) => getWet().Close(id),
      listen: (path, onAccept) => services.set(path, onAccept),
    };
    globalThis.AF_UNIX = AF_UNIX;

    // ══════════════════════════════════ 3. newline-delimited JSON framing ══════════════════════════════════
    class LineConn {
      constructor(conn, label) {
        this.conn = conn;
        this.label = label;
        this.buf = '';
        this.onmessage = null;
        this.onclose = null;
        conn.ondata = (u8) => {
          this.buf += dec.decode(u8, { stream: true });
          let i;
          while ((i = this.buf.indexOf('\n')) >= 0) {
            const line = this.buf.slice(0, i);
            this.buf = this.buf.slice(i + 1);
            if (!line.trim()) continue;
            try { this.onmessage?.(JSON.parse(line)); }
            catch (e) { log('error', `${this.label}: bad JSON (${e.message}): ${line.slice(0, 120)}`); }
          }
        };
        conn.onclose = () => this.onclose?.();
      }
      send(obj) {
        try { this.conn.writeAll(enc.encode(JSON.stringify(obj) + '\n')).catch((e) => log('warn', `${this.label}: write failed — ${e.message}`)); }
        catch (e) { log('warn', `${this.label}: write failed — ${e.message || e}`); }
      }
      close() { try { this.conn.close(); } catch { } }
    }

    // ══════════════════════════════════ 4. window list ══════════════════════════════════
    let listConn = null;
    let windows = [];
    let curWin = null;
    let winConn = null;
    let winEpoch = 0;

    function redrawList() {
      const c = $('#winlist');
      c.innerHTML = '';
      info('#wincount', windows.length ? `(${windows.length})` : '');
      if (!windows.length) { c.innerHTML = '<span class="dim">no windows yet</span>'; return; }
      windows.forEach((w) => {
        const d = document.createElement('div');
        d.className = 'win' + (curWin && w.handle === curWin.handle ? ' active' : '');
        d.innerHTML = `${esc(w.title || '(untitled)')}${w.compositor ? ' ★ compositor' : ''}` +
          `<small>${esc(w.handle)} · ${w.width}x${w.height} · ${esc(w.state || 'Normal')} · ${esc(w.socket || '')}</small>`;
        d.onclick = () => connectWin(w);
        c.appendChild(d);
      });
    }

    function upsertWin(w) {
      windows = windows.filter((x) => x.handle !== w.handle);
      windows.push(w);
      windows.sort((a, b) => (b.compositor ? 1 : 0) - (a.compositor ? 1 : 0) || String(a.handle).localeCompare(String(b.handle)));
      redrawList();
    }

    function handleListMessage(m) {
      switch (m.type) {
        case 'list':
          windows = (m.windows || []).slice();
          redrawList();
          info('#info-list', `#${listConn?.conn.id} · ${windows.length} window(s) · screen ${(m.screen || []).join('x')}`);
          log('ok', `window list: ${windows.length} window(s), screen ${(m.screen || []).join('x')}`);
          break;
        case 'window-added':
          upsertWin(m.window);
          log('info', `window added: ${m.window.title || m.window.handle}`);
          break;
        case 'window-removed':
          windows = windows.filter((x) => x.handle !== m.window.handle);
          if (curWin && curWin.handle === m.window.handle) closeWin('window destroyed');
          redrawList();
          log('info', `window removed: ${m.window.handle}`);
          break;
        case 'window-updated': upsertWin(m.window); break;
        case 'log': log('info', '[dotnet] ' + (m.text || '')); break;
        case 'error': log('error', 'server: ' + (m.message || 'error')); break;
        default: log('info', `list: unhandled "${m.type}"`); break;
      }
    }

    function connectList() {
      if (runtimeDead) return;
      if (!wet) { setTimeout(connectList, 500); return; }
      if (listConn) return;
      let c;
      try { c = AF_UNIX.connect(LIST_PATH); }
      catch (e) {
        info('#info-list', 'waiting for ' + LIST_PATH);
        setTimeout(connectList, 700);
        return;
      }
      listConn = new LineConn(c, 'window-list');
      listConn.onmessage = handleListMessage;
      listConn.onclose = () => {
        log('warn', `window-list #${c.id} closed`);
        listConn = null;
        info('#info-list', 'disconnected — retrying');
        setTimeout(connectList, 1000);
      };
      info('#info-list', `#${c.id} → unix:${LIST_PATH}`);
      log('ok', `connected #${c.id} → unix:${LIST_PATH}`);
    }

    // ══════════════════════════════════ 5. one window ══════════════════════════════════
    function clearWinUI() {
      const img = $('#frame');
      img.src = '';
      img.style.display = 'none';
      $('#svgwrap').style.display = 'none';
      $('#svgwrap').innerHTML = '';
    }

    function closeWin(reason) {
      winEpoch++;
      if (winConn) { winConn.close(); winConn = null; }
      curWin = null;
      clearWinUI();
      setBar('not connected' + (reason ? ` (${reason})` : ''));
      info('#info-win', 'not connected');
      redrawList();
    }

    function connectWin(w) {
      winEpoch++;
      if (winConn) { winConn.close(); winConn = null; }
      const myEpoch = winEpoch;
      curWin = w;
      clearWinUI();
      redrawList();
      setBar(`window: ${w.title || w.handle} · ${w.width}x${w.height}`);
      info('#info-win', `connecting → unix:${w.socket}`);

      let c;
      try { c = AF_UNIX.connect(w.socket); }
      catch (e) {
        log('error', `connect ${w.socket}: ${e.message || e}`);
        info('#info-win', 'connect failed');
        return;
      }

      winConn = new LineConn(c, 'window');
      info('#info-win', `#${c.id} → unix:${w.socket}`);
      log('ok', `connected #${c.id} → unix:${w.socket}`);

      winConn.onmessage = (m) => {
        if (myEpoch !== winEpoch) return;
        switch (m.type) {
          case 'hello':
          case 'info':
            if (m.window) setBar(`window: ${m.window.title || m.window.handle} · ${m.window.width}x${m.window.height}`);
            log('info', `${m.type}: ${m.window ? (m.window.title || m.window.handle) : ''}`);
            break;
          case 'frame': handleFrame(m); break;
          case 'log': log('info', '[dotnet] ' + (m.text || '')); break;
          case 'bye':
            setBar('window closed by server');
            log('warn', 'server said bye');
            closeWin('bye');
            break;
          case 'pong': log('ok', 'pong'); break;
          case 'error': log('error', 'server: ' + (m.message || 'error')); break;
          default: log('info', `window: unhandled "${m.type}"`); break;
        }
      };
      winConn.onclose = () => {
        if (myEpoch !== winEpoch) return;
        log('warn', `window socket #${c.id} closed`);
        winConn = null;
        info('#info-win', 'disconnected');
        if (curWin) setTimeout(() => { if (myEpoch === winEpoch) connectWin(curWin); }, 1500);
      };

      resub();
    }

    function resub() {
      if (!winConn) return;
      const opts = {
        format: $('#fmt').value,
        quality: +$('#q').value,
        gray: $('#gray').checked,
        fps: +$('#fps').value || 0,
      };
      if ($('#live').checked) winConn.send({ type: 'subscribe', ...opts });
      else winConn.send({ type: 'unsubscribe' });
      winConn.send({ type: 'refresh', ...opts, full: true });
      log('info', `stream: ${opts.format} q=${opts.quality}${opts.gray ? ' gray' : ''}${opts.fps ? ' @' + opts.fps + 'fps' : ' uncapped'}${$('#live').checked ? ' live' : ' manual'}`);
    }

    // ══════════════════════════════════ 6. frames ══════════════════════════════════
    let frameCount = 0;
    let lastFrame = null;
    let fpsCount = 0, fpsMark = performance.now(), fpsShown = 0;

    function handleFrame(m) {
      frameCount++;
      fpsCount++;
      const now = performance.now();
      if (now - fpsMark >= 1000) {
        fpsShown = Math.round(fpsCount * 1000 / (now - fpsMark));
        fpsCount = 0;
        fpsMark = now;
      }
      info('#info-frames', String(frameCount));
      info('#info-fps', `${fpsShown} fps`);

      if (m.format === 'svg') {
        lastFrame = { format: 'svg', data: m.data };
        $('#frame').style.display = 'none';
        $('#svgwrap').style.display = 'block';
        $('#svgwrap').innerHTML = m.data;
        setBar(`frame #${frameCount} · svg ${m.width}x${m.height} · ${fpsShown} fps`);
      } else {
        lastFrame = { format: m.format, data: m.data };
        $('#svgwrap').style.display = 'none';
        $('#svgwrap').innerHTML = '';
        const img = $('#frame');
        img.style.display = 'block';
        img.src = 'data:image/' + m.format + ';base64,' + m.data;
        setBar(`frame #${frameCount} · ${m.format} ${m.width}x${m.height} · ${fpsShown} fps`);
      }
    }

    // ══════════════════════════════════ 7. input (HTML → .NET) ══════════════════════════════════
    function imgPos(e) {
      const img = $('#frame');
      if (img.style.display === 'none' || !img.naturalWidth) return null;
      const r = img.getBoundingClientRect();
      const scale = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
      const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
      const ox = r.left + (r.width - dw) / 2, oy = r.top + (r.height - dh) / 2;
      const x = Math.floor((e.clientX - ox) / scale);
      const y = Math.floor((e.clientY - oy) / scale);
      if (x < 0 || y < 0 || x >= img.naturalWidth || y >= img.naturalHeight) return null;
      return { x, y };
    }
    function svgPos(e) {
      const svg = $('#svgwrap').querySelector('svg');
      if (!svg) return null;
      const r = svg.getBoundingClientRect();
      const vb = svg.viewBox && svg.viewBox.baseVal;
      const w = (vb && vb.width) || svg.width.baseVal.value;
      const h = (vb && vb.height) || svg.height.baseVal.value;
      const x = Math.floor((e.clientX - r.left) / r.width * w);
      const y = Math.floor((e.clientY - r.top) / r.height * h);
      if (x < 0 || y < 0 || x >= w || y >= h) return null;
      return { x, y };
    }
    function pos(e) { return $('#frame').style.display !== 'none' ? imgPos(e) : svgPos(e); }
    function btnName(b) { return b === 2 ? 'right' : b === 1 ? 'middle' : 'left'; }
    function sendWin(obj) { if (winConn && !runtimeDead) winConn.send(obj); }

    const stage = $('#stage');
    stage.addEventListener('mousedown', (e) => {
      const p = pos(e); if (!p) return;
      sendWin({ type: 'mousedown', x: p.x, y: p.y, button: btnName(e.button), t: Date.now() });
    });
    stage.addEventListener('mouseup', (e) => {
      const p = pos(e); if (!p) return;
      sendWin({ type: 'mouseup', x: p.x, y: p.y, button: btnName(e.button), t: Date.now() });
    });
    stage.addEventListener('mousemove', (e) => {
      const p = pos(e); if (!p) return;
      sendWin({ type: 'mousemove', x: p.x, y: p.y, button: 'left', t: Date.now() });
    });
    stage.addEventListener('wheel', (e) => {
      const p = pos(e); if (!p) return;
      sendWin({ type: 'wheel', x: p.x, y: p.y, delta: e.deltaY });
      e.preventDefault();
    }, { passive: false });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
    stage.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());

    const codeToKey = {
      Enter: 'Return', Backspace: 'Back', Tab: 'Tab', Escape: 'Escape', Space: 'Space',
      ShiftLeft: 'LShiftKey', ShiftRight: 'RShiftKey',
      ControlLeft: 'LControlKey', ControlRight: 'RControlKey',
      AltLeft: 'LMenu', AltRight: 'RMenu',
      MetaLeft: 'LWin', MetaRight: 'RWin',
      CapsLock: 'CapitalLock', ScrollLock: 'Scroll', NumLock: 'NumLock', Pause: 'Pause',
      Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown',
      Insert: 'Insert', Delete: 'Delete', ContextMenu: 'Apps',
      Semicolon: 'Oem1', Equal: 'Oemplus', Comma: 'Oemcomma', Minus: 'OemMinus',
      Period: 'OemPeriod', Slash: 'OemQuestion', Backquote: 'Oem8',
      BracketLeft: 'OemOpenBrackets', BracketRight: 'OemCloseBrackets',
      Backslash: 'Oem5', Quote: 'Oem7',
    };
    function keyName(e) {
      const c = e.code || '';
      if (c.startsWith('Key')) return c.slice(3);
      if (c.startsWith('Digit')) return c.slice(5);
      if (c.startsWith('Arrow')) return c.slice(5);
      if (c.startsWith('Numpad')) return 'NumPad' + c.slice(6);
      if (/^F\d$/.test(c)) return c;
      return codeToKey[c] || (e.key && e.key.length === 1 ? e.key.toUpperCase() : (e.key || ''));
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '0')) return;
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;   // sidebar stays usable
      sendWin({ type: 'keydown', key: keyName(e) });
      if (e.key && e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey)
        sendWin({ type: 'text', text: e.key });
      if (['Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Backspace', ' '].includes(e.key)) e.preventDefault();
    });
    document.addEventListener('keyup', (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      sendWin({ type: 'keyup', key: keyName(e) });
    });

    // ══════════════════════════════════ 8. sidebar wiring ══════════════════════════════════
    $('#refresh').onclick = () => resub();
    $('#clearlog').onclick = () => { logBox.textContent = ''; };
    $('#copylog').onclick = async () => {
      try { await navigator.clipboard.writeText(logBox.textContent); log('ok', 'log copied to clipboard'); }
      catch (e) { log('warn', 'copy failed: ' + (e.message || e)); }
    };
    $('#save').onclick = () => {
      if (!lastFrame) { log('warn', 'no frame to save yet'); return; }
      const a = document.createElement('a');
      if (lastFrame.format === 'svg') {
        a.href = URL.createObjectURL(new Blob([lastFrame.data], { type: 'image/svg+xml' }));
        a.download = 'frame.svg';
      } else {
        a.href = 'data:image/' + lastFrame.format + ';base64,' + lastFrame.data;
        a.download = 'frame.' + (lastFrame.format === 'jpeg' ? 'jpg' : lastFrame.format);
      }
      a.click();
      log('ok', 'saved ' + a.download);
    };
    $('#fmt').onchange = () => resub();
    $('#q').onchange = () => resub();
    $('#gray').onchange = () => resub();
    $('#fps').onchange = () => resub();
    $('#live').onchange = () => resub();

    $('#btn-reconnect').onclick = () => {
      log('info', 'manual reconnect');
      if (curWin) connectWin(curWin); else connectList();
    };
    $('#btn-disconnect').onclick = () => closeWin('manual');
    $('#btn-ping').onclick = () => { log('info', 'ping →'); sendWin({ type: 'ping' }); };
    $('#btn-die').onclick = () => die('manual (test)', 'warn');
    $('#btn-listeners').onclick = () => {
      try {
        const rows = AF_UNIX.listeners();
        log('info', `AF_UNIX listeners (${rows.length}):`);
        rows.forEach((r) => log('info', `  ${r.host === 'js' ? '[js] ' : '[net]'} unix:${r.path}  ${r.state}  pending ${r.pending}/${r.backlog}`));
      } catch (e) { log('error', 'listeners: ' + (e.message || e)); }
    };

    window.addEventListener('error', (e) => log('error', 'window.onerror: ' + (e.message || e)));
    window.addEventListener('unhandledrejection', (e) =>
      log('error', 'unhandledrejection: ' + ((e.reason && e.reason.message) || e.reason)));
    window.addEventListener('beforeunload', () => {
      try { winConn?.close(); listConn?.close(); } catch { }
    });

    // a JS-side AF_UNIX service, same trick as Test.html: proves the wire both ways
    AF_UNIX.listen('/js-echo', (c) => {
      log('info', `[js-echo] attached #${c.id}`);
      c.ondata = (u8) => c.write(u8);
    });

    // ══════════════════════════════════ 9. boot ══════════════════════════════════
    setTag('wait', 'resolving WetJs…');
    const ok = await initWet();
    if (!ok) {
      setTag('off', 'WetJs not found');
      info('#info-wet', 'NOT FOUND');
      log('error', `WetJs exports never appeared (looked in: ${getConfig().mainAssemblyName}, WetAfunix, Wystem.Wet). ` +
        'Check the assembly name, that WetAfunix is referenced, and that trimming has not removed it.');
    } else {
      setTag('on', 'runtime up');
      log('ok', 'WetJs ready — connecting to window-list');
    }

    connectList();
    setInterval(connectList, 1500);

    // Drive the WinForms message loop from the browser event loop so socket
    // continuations keep flowing while Application.Run blocks in GetMessage.
    if (pump) {
      info('#info-pump', 'exported (' + (wetSource || '?') + ')');
      log('ok', 'message pump export found — driving the UI loop at ~60 Hz');
      setInterval(() => {
        if (runtimeDead) return;
        try { pump(); }
        catch (e) { die('pump threw: ' + (e.message || e)); }
      }, 16);
    } else {
      info('#info-pump', 'NOT EXPORTED');
      log('warn', 'no Pump export found — frames may work, but input needs it. ' +
        'Add [JSExport] Pump() (BootUpJs or XplatUISocketWasm) to keep the message loop live.');
      // it can show up later, once Main has run
      setTimeout(async () => {
        await tryResolveWet();
        if (pump && !runtimeDead) {
          info('#info-pump', 'exported (late)');
          log('ok', 'Pump export appeared later — starting the loop driver');
          setInterval(() => { if (!runtimeDead) { try { pump(); } catch (e) { die('pump threw: ' + (e.message || e)); } } }, 16);
        }
      }, 2500);
    }

    function startPump(when) {
      info('#info-pump', `exported (${when}) · ${wetSource || '?'}`);
      log('ok', 'message pump export found — driving the UI loop at ~60 Hz');
      setInterval(() => {
        if (runtimeDead) return;
        try { pump(); }
        catch (e) { die('pump threw: ' + (e.message || e)); }
      }, 16);
    }

    if (pump) startPump('boot');
    else {
      info('#info-pump', 'NOT EXPORTED');
      setTimeout(async () => { await tryResolveWet(); if (pump && !runtimeDead) startPump('late'); }, 2500);
    }

    // run the C# Main(); when it returns or throws, stop touching the runtime
    // run the C# Main(); in the ST pump model it returning is EXPECTED —
    // the form is shown and this page keeps dispatching through Pump().
    try {
      await dotnet.runMain();
      log('info', 'Main returned — UI keeps running under Pump()');
      info('#info-pump', pump ? 'running (Main returned)' : 'waiting for Pump export');
      if (!pump) { await tryResolveWet(); if (pump) startPump('late'); }
    } catch (e) {
      die('Main threw: ' + ((e && e.stack) || e));
    }
  </script>
</body>
